[project]
name = "aai-hydric-stress"
version = "0.1.0"
description = "Prototipo experimental de arquitectura de IA para detección temprana de estrés hídrico (Trabajo Final, Maestría en IA, FIUBA)"
requires-python = ">=3.10"
dependencies = [
    "tomli>=2,<3; python_version<'3.11'",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "requests>=2.31",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "scikit-learn>=1.4",
    "mlflow>=2.14,<3",
    # mlflow (>=2.14,<3) declares "sqlalchemy<3,>=1.4.0" as its own
    # constraint, but mlflow/store/db/utils.py unconditionally imports
    # `FallbackAsyncAdaptedQueuePool` from `sqlalchemy.pool` — a symbol
    # removed in SQLAlchemy 2.1.0. Without this pin, an unconstrained
    # resolver (e.g. CI installing fresh) can pick sqlalchemy==2.1.0 and
    # break every test that imports mlflow with
    # `ImportError: cannot import name 'FallbackAsyncAdaptedQueuePool'
    # from 'sqlalchemy.pool'`. Verified: sqlalchemy 2.0.52 still exports
    # it, 2.1.0 does not.
    "sqlalchemy<2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "black>=24.0",
    "ipykernel>=6.29",
]
backend = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
# Resolve shared test fixtures from the repository root, including runs from backend/.
pythonpath = [".", "src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.black]
line-length = 100
target-version = ["py310"]
