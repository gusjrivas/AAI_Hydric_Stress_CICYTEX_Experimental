name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Formato (black)
        run: black --check src tests

      - name: Tests (pytest)
        run: pytest

  laya-oci-tar-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test bounded OCI TAR semantics
        run: >-
          python -m pytest
          tests/test_laya_runtime_oci_tar.py
          tests/test_laya_runtime_oci_rootfs.py
          tests/test_laya_runtime_oci_layers.py
          tests/test_laya_runtime_oci_layout_filesystem.py

  laya-checkpoint-bytes-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test checkpoint byte contracts
        run: >-
          python -m pytest
          tests/test_laya_runtime_checkpoint.py
          tests/test_laya_runtime_checkpoint_filesystem.py

  laya-runtime-provenance-contract:
    needs: laya-checkpoint-bytes-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test runtime provenance contract
        run: python -m pytest tests/test_laya_runtime_provenance.py

  experiment-v4-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir el entorno experimental fijado (controlled_daily_v4)
        run: |
          python3 docker/experiment-v4/build.py -t experiment-v4-controlled-daily-v4

      - name: Ejecutar la suite sintética de la Etapa A dentro del contenedor
        run: docker run --rm experiment-v4-controlled-daily-v4

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev,backend]"

      - name: Lint (ruff)
        run: ruff check backend/app

      - name: Formato (black)
        run: black --check backend/app

      - name: Tests (pytest)
        run: >-
          cd backend && python -m pytest tests/
          --ignore=tests/test_openapi_typescript_ci_contract.py

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: cd frontend && npm ci

      - name: Tests (vitest)
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build

  api-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install constrained Python dependencies
        run: pip install -c backend/openapi-schema-constraints.txt -e ".[dev,backend]"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test OpenAPI TypeScript contracts
        run: >-
          python -m pytest
          tests/test_openapi_typescript_foundation.py
          backend/tests/test_openapi_typescript_composition.py
          backend/tests/test_openapi_typescript_ci_contract.py

      - name: Test local TypeScript generator
        working-directory: frontend
        run: npm run test:api-toolchain

      - name: Check generated contract artifacts
        working-directory: frontend
        run: npm run api:check
