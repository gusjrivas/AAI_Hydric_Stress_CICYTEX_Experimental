name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Formato (black)
        run: black --check src tests

      - name: Tests (pytest)
        run: pytest

  laya-oci-tar-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test bounded OCI TAR semantics
        run: >-
          python -m pytest
          tests/test_laya_runtime_oci_tar.py
          tests/test_laya_runtime_oci_rootfs.py
          tests/test_laya_runtime_oci_layers.py
          tests/test_laya_runtime_oci_layout_filesystem.py

  laya-runtime-base-ancestry-contract:
    needs: laya-oci-tar-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test runtime base ancestry contract
        run: python -m pytest tests/test_laya_runtime_base_ancestry.py

  laya-checkpoint-bytes-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test checkpoint byte contracts
        run: >-
          python -m pytest
          tests/test_laya_runtime_checkpoint.py
          tests/test_laya_runtime_checkpoint_filesystem.py

  laya-runtime-provenance-contract:
    needs: laya-checkpoint-bytes-contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test runtime provenance contract
        run: python -m pytest tests/test_laya_runtime_provenance.py

  laya-runtime-supply-convergence-contract:
    needs:
      - laya-runtime-base-ancestry-contract
      - laya-runtime-provenance-contract
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Test runtime supply convergence contract
        run: >-
          python -m pytest
          tests/test_laya_runtime_supply_convergence_contract.py
          tests/test_laya_runtime_supply_convergence_security.py
          tests/test_laya_runtime_supply_convergence_privacy.py

  laya-rootfs-materialization-contract:
    needs: laya-runtime-supply-convergence-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Require non-root Linux runner
        run: python -c "import os; assert os.geteuid() != 0"

      - name: Test rootfs materialization contract and OCI regressions
        run: >-
          python -m pytest
          tests/test_laya_runtime_rootfs_materialization.py
          tests/test_laya_runtime_rootfs_materialization_capture.py
          tests/test_laya_runtime_rootfs_materialization_filesystem.py
          tests/test_laya_runtime_rootfs_materialization_integration.py
          tests/test_laya_runtime_rootfs_materialization_linux.py
          tests/test_laya_runtime_rootfs_materialization_streaming.py
          tests/test_laya_runtime_oci_tar.py
          tests/test_laya_runtime_oci_layout_filesystem.py
          tests/test_laya_runtime_oci_rootfs.py

  laya-runtime-materialization-contract:
    needs: laya-rootfs-materialization-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Require non-root Linux runner
        run: python -c "import os; assert os.geteuid() != 0"

      - name: Test runtime materialization contracts
        run: >-
          python -m pytest
          tests/test_laya_runtime_materialization.py
          tests/test_laya_runtime_materialization_lease.py
          tests/test_laya_runtime_installation_archive.py
          tests/test_laya_runtime_installation_verifier.py
          tests/test_laya_docker_runtime_materialization.py
          tests/test_laya_local_docker_engine.py

      # This exercises only a tiny synthetic TAR against the runner's local
      # trusted daemon. It does not fetch the 677 MiB OCI source, checkpoints,
      # model weights, or any network input and never executes inference.
      - name: Test synthetic local Docker Engine mechanics
        env:
          LAYA_LOCAL_DOCKER_LIVE: "1"
        run: python -m pytest tests/test_laya_local_docker_engine_live.py

  experiment-v4-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construir el entorno experimental fijado (controlled_daily_v4)
        run: |
          python3 docker/experiment-v4/build.py -t experiment-v4-controlled-daily-v4

      - name: Ejecutar la suite sintética de la Etapa A dentro del contenedor
        run: docker run --rm experiment-v4-controlled-daily-v4

  backend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -e ".[dev,backend]"

      - name: Lint (ruff)
        run: ruff check backend/app

      - name: Formato (black)
        run: black --check backend/app

      - name: Tests (pytest)
        run: >-
          cd backend && python -m pytest tests/
          --ignore=tests/test_openapi_typescript_ci_contract.py

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: cd frontend && npm ci

      - name: Tests (vitest)
        run: cd frontend && npm run test

      - name: Build
        run: cd frontend && npm run build

  api-contract:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install constrained Python dependencies
        run: pip install -c backend/openapi-schema-constraints.txt -e ".[dev,backend]"

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test OpenAPI TypeScript contracts
        run: >-
          python -m pytest
          tests/test_openapi_typescript_foundation.py
          backend/tests/test_openapi_typescript_composition.py
          backend/tests/test_openapi_typescript_ci_contract.py

      - name: Test local TypeScript generator
        working-directory: frontend
        run: npm run test:api-toolchain

      - name: Check generated contract artifacts
        working-directory: frontend
        run: npm run api:check

  browser-journeys:
    # Recorridos en navegador REAL (Chrome por CDP) contra el build del frontend y un servidor de fixtures
    # determinista (respuestas grabadas del backend; ver frontend/e2e/fixtures/README.md). No usa backend ni modelos.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PORT: "4173"
      BASE_URL: http://127.0.0.1:4173
      OUT_DIR: ui-journeys-out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Test browser-journey helpers
        run: node --test "scripts/ui/**/*.test.mjs"

      - name: Build frontend against same-origin fixtures
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ""
        run: npm run build -- --outDir dist/e2e --emptyOutDir

      - name: Start fixture server
        run: |
          node scripts/ui/fixture-server.mjs > fixture-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS "$BASE_URL/__fixture/state" > /dev/null && exit 0
            sleep 1
          done
          cat fixture-server.log
          exit 1

      - name: Verify journeys in Chrome
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/ui/verify-journeys.mjs

      - name: Upload journey results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-journeys
          path: |
            ui-journeys-out
            fixture-server.log
          if-no-files-found: warn
